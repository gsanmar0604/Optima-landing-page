  <!-- Open Graph: cómo se ve el enlace al compartirlo por WhatsApp, LinkedIn, etc. -->

  cambiadlo cuando tengáis dominio propio. -->
  <meta property="og:image" content="https://optima-landing-page.web.app/images/og.png">
  <meta property="og:image:width" content="1200">

  <meta property="og:url" content="https://optima-landing-page.web.app/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap">

  <link rel="icon" href="favicon.ico" sizes="any">
